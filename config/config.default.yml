# UOC2 存档修改器配置（初始模板）
#
# 本文件随工具一同分发：首次运行修改器时会把它复制为 config/config.yml，
# 再由配置引导就地把下面的取值确认一遍。之后直接编辑 config.yml 即可，
# 本文件不要改（升级时会被覆盖）。
#
# 所有键都可以省略，省略时按注释里写的默认值处理。

# 游戏数据目录（%LOCALAPPDATA%/.uoc2）。存档（save/）与临时 mod（_packages/）都在这里。
uoc2_appdata: "%LOCALAPPDATA%/.uoc2"

# 状态目录：存档解包工作区（work/）与自动生成的参考列表（references/）存放处。
# 三个取值形式：
#   ""          默认，放在启动脚本（run.bat / 项目根目录）旁的 data/
#   "appdata"   放回游戏数据目录 <uoc2_appdata>/modifier（旧版行为）
#   其他路径    自定义绝对路径，支持 %LOCALAPPDATA% 之类环境变量
# 注意：临时 mod 目录必须留在游戏的 _packages 下，不受此项影响。
state_dir: ""

# 游戏安装目录中的原版 _packages 目录。单位/总部与卡牌的中文名、卡牌费用
# （cardBuy）、自定义类型原型都从这里读取。留空时按默认位置
# D:\SteamLibrary\steamapps\common\Unity of Command 2\_packages 探测；
# 探测不到则这些功能退化，但改数值不受影响。
uoc2_orig_packages_path: ""

# 额外原型搜索路径（结构同原版 _packages 下的包）。
mod_search_paths: []

# 本地化语言子目录（chi/eng/...）。
locale: "chi"

# 是否已经跑过配置引导。初始模板为 false，引导完成后写成 true；
# 改回 false 可让下次启动重新进入引导（等同于 --setup）。
setup_done: false
