<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>统一指挥 2 存档修改器</title>
<style>
:root{
  --window:#f4f6f8; --surface:#f7f8fa; --surface-alt:#eef1f4;
  --border:#d4dbe3; --text:#1f2933; --muted:#5c6b7a;
  --accent:#245b8f; --accent-dark:#17456f; --accent-light:#dceaf7; --selection:#cfe3f5;
  --ok:#1e6b3a; --ok-light:#e6f2ea; --warn:#8a5a00; --warn-light:#faf1e2;
  --danger:#a42d2c; --danger-light:#fbe9ea; --stage:#e4eaf1;
  --mono:"Cascadia Mono",Consolas,"SF Mono",monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--window);color:var(--text);
  font:13px/1.5 "Microsoft YaHei UI","Segoe UI",system-ui,sans-serif}
button,input{font:inherit}

/* ---------------- 启动页 ---------------- */
#splash{min-height:100%;display:flex;flex-direction:column;align-items:center;
  padding:56px 32px 32px}
#splash h1{font-size:30px;font-weight:800;color:var(--accent-dark);margin:0 0 4px}
#splash .sub{color:var(--muted);margin-bottom:22px}
.picker{width:min(1180px,100%);background:var(--surface);border:1px solid var(--border);
  border-radius:10px;overflow:hidden}
.picker .bar{display:flex;gap:10px;align-items:center;padding:12px 14px;
  border-bottom:1px solid var(--border);background:var(--surface-alt)}
.picker .bar input{flex:1;padding:7px 10px;border:1px solid var(--border);border-radius:6px;
  background:var(--surface);outline:none}
.picker .bar input:focus{border-color:var(--accent)}
.picker .bar button{padding:7px 14px;border:1px solid var(--border);border-radius:6px;
  background:var(--surface);cursor:pointer}
.picker .bar button:hover{border-color:var(--accent);color:var(--accent)}
table.list{width:100%;border-collapse:collapse}
table.list th{background:var(--accent-dark);color:#fff;text-align:left;padding:8px 12px;
  font-size:12px;font-weight:600;position:sticky;top:0}
table.list td{padding:7px 12px;border-bottom:1px solid var(--surface-alt);font-size:12.5px}
table.list tbody tr:hover{background:var(--accent-light)}
table.list tbody tr{cursor:pointer}
table.list td.num{font-family:var(--mono);text-align:right;white-space:nowrap}
table.list td.k{color:var(--muted)}
#splash .empty{padding:26px;text-align:center;color:var(--muted)}

/* ---------------- 主界面 ---------------- */
#app{display:none;height:100vh;flex-direction:column}
.hdr{display:flex;align-items:center;gap:10px;padding:9px 14px;
  background:var(--surface);border-bottom:1px solid var(--border)}
.hdr .logo{width:24px;height:24px;border-radius:6px;background:var(--accent);
  color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}
.hdr .title{font-weight:700;color:var(--accent-dark)}
.hdr .caps{font-size:11.5px;color:var(--muted);display:flex;gap:9px;align-items:center;
  flex-wrap:wrap;margin-left:6px}
.hdr .caps b{font-weight:700}
.hdr .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:1px 7px;
  border-radius:9px;border:1px solid var(--border);background:var(--surface-alt);color:var(--muted)}
.pill.on{background:var(--ok-light);border-color:#a8d5bb;color:var(--ok)}
.pill.off{background:var(--danger-light);border-color:#e8b3b2;color:var(--danger)}
.btn{padding:6px 13px;border:1px solid var(--border);border-radius:6px;background:var(--surface);
  cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.btn.pri:hover{background:var(--accent-dark);color:#fff}

.body{flex:1;display:flex;min-height:0}
.rail{width:168px;flex:none;background:var(--surface);border-right:1px solid var(--border);
  padding:8px 0}
.rail .grp{font-size:10.5px;color:var(--muted);letter-spacing:.08em;padding:10px 14px 4px}
.rail .nav{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;font-size:12.5px}
.rail .nav:hover{background:var(--accent-light)}
.rail .nav.on{background:var(--selection);color:var(--accent-dark);font-weight:600}
.rail .nav .ic{width:16px;text-align:center;color:var(--muted)}
.rail .nav.on .ic{color:var(--accent)}
.work{flex:1;min-width:0;display:flex;flex-direction:column;overflow:auto;padding-bottom:8px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:8px;
  margin:14px;overflow:hidden}
.panel>h3{margin:0;padding:10px 14px;font-size:12.5px;font-weight:700;color:var(--accent-dark);
  border-bottom:1px solid var(--border);background:var(--surface-alt)}
.pbody{padding:14px}
.placeholder{padding:34px;text-align:center;color:var(--muted)}
.placeholder .big{font-size:15px;color:var(--text);margin-bottom:6px}
.capgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.capcard{border:1px solid var(--border);border-radius:7px;padding:10px 12px;background:var(--surface)}
.capcard .h{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:4px}
.capcard .r{font-size:11.5px;color:var(--danger)}
.capcard.ok .h{color:var(--ok)}
.capcard.off{border-color:#e8b3b2;background:var(--danger-light)}
.capcard.off .h{color:var(--danger)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:12.5px}
.kv .k{color:var(--muted)}
.kv .v{font-family:var(--mono)}
.status{display:flex;align-items:center;gap:14px;padding:6px 14px;
  background:var(--surface);border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
.status .ok{color:var(--ok)} .status .no{color:var(--danger)}
.note{border:1px solid var(--border);border-radius:7px;background:var(--surface-alt);
  padding:10px 12px;font-size:11.5px;color:var(--muted);line-height:1.6}
.note b{color:var(--text)}
/* 数值控件（U32：大数字=输入框；滚轮统一用 Alt 键） */
.tun{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--surface-alt)}
.tun:last-child{border-bottom:none}
.tun .k{width:56px;color:var(--muted)}
/* U32：数值控件 —— 大数字给输入框；小数字只给 Alt+滚轮 */
.tun .num{width:88px;text-align:center;padding:3px 8px;border:1px dashed var(--border);
  border-radius:6px;background:var(--surface);font-family:var(--mono);
  font-weight:700;font-size:17px;color:var(--accent-dark);font-variant-numeric:tabular-nums;
  outline:none}
.tun .num:hover{border-color:var(--accent)}
.tun .num:focus{border-color:var(--accent);background:var(--accent-light)}
.tun .num.dirty{border-color:var(--accent);background:var(--accent-light)}
.tun .num.bad{border-color:var(--danger);background:var(--danger-light);color:var(--danger)}
.tun .hint{font-size:11px;color:var(--muted)}
.tun .old{font-size:11px;color:var(--muted);font-family:var(--mono)}

/* ===================================================================
   U34：6 个功能页的组件层 —— 搬自 docs/GUI视觉稿.html（视觉稿即实现）
   =================================================================== */
:root{--stage-edge:#c7d2dd; --stage-sup:#8fa3b8}
.cols{display:grid;grid-template-columns:minmax(290px,0.6fr) minmax(430px,1.4fr);gap:14px}
.cols>*{min-width:0}
.cols-wide{grid-template-columns:minmax(520px,1.45fr) minmax(340px,1fr)}
.cols-half{grid-template-columns:minmax(300px,1fr) minmax(300px,1fr)}
.toolbar{display:flex;align-items:center;gap:10px;background:var(--surface-alt);
  border:1px solid var(--border);border-radius:6px;padding:7px 10px;margin-bottom:12px}
.inp{background:#fff;border:1px solid var(--border);border-radius:6px;padding:5px 9px;
  font:inherit;font-size:13px;color:var(--text)}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(36,91,143,.13)}
.toolbar .sp{flex:1}
.sel{border:1px solid var(--border);background:#fff;border-radius:6px;padding:5px 9px;font-size:13px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text)}
.tabs{display:flex;gap:2px;background:var(--surface-alt);border:1px solid var(--border);
  border-radius:6px;padding:2px;width:fit-content;margin:0 0 12px}
.tabs .tb{padding:4px 13px;font-size:12.5px;border-radius:5px;color:var(--muted);cursor:pointer}
.tabs .tb.on{background:var(--surface);color:var(--accent-dark);font-weight:600;
  box-shadow:0 1px 3px rgba(20,40,60,.12)}
.tabs .tb .n{font-family:var(--mono);font-size:11px;opacity:.75;margin-left:4px}
/* 单位行 */
.rows{max-height:430px;overflow:auto}
.urow{display:flex;align-items:center;gap:11px;padding:9px 12px;
  border-bottom:1px solid #f0f3f6;cursor:pointer}
.urow:hover{background:var(--accent-light)}
.urow.sel{background:var(--selection)}
.ava{width:52px;height:52px;border-radius:6px;background:var(--stage);
  border:1px solid var(--stage-edge);flex:none;display:grid;place-items:center;overflow:hidden}
.ava img{max-width:100%;max-height:100%;object-fit:contain}
.umin{flex:1;min-width:0}
.uname{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px;
  white-space:nowrap;overflow:hidden}
.uname .full{color:var(--muted);font-size:11px;font-weight:400;font-family:var(--mono)}
.umeta{font-size:11.5px;color:var(--muted);margin-top:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pips{display:flex;gap:2px;margin-top:4px}
.pip{width:13px;height:9px;border-radius:2px;background:var(--surface-alt);border:1px solid var(--border)}
.pip.on{background:var(--accent);border-color:var(--accent-dark)}
.pip.sup{background:var(--stage-sup);border-color:#a9b7c7}
.ubadges{display:flex;align-items:center;gap:4px;flex:none}
.ubadge{width:22px;height:22px;border-radius:5px;background:var(--stage);
  border:1px solid var(--stage-edge);display:grid;place-items:center;overflow:hidden;flex:none}
.ubadge img{max-width:100%;max-height:100%;object-fit:contain}
.ucount{font-family:var(--mono);font-size:11.5px;font-weight:700;color:var(--accent-dark);
  background:var(--accent-light);border:1px solid #b9d3ea;border-radius:9px;padding:0 6px}
/* 详情抬头 */
.detail{padding:14px}
.dhead{display:flex;gap:16px;align-items:stretch}
.dhead .ava{width:76px;height:76px;flex:none;align-self:center}
.dhead .idblk{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.dhead .vsep{width:1px;background:var(--border);flex:none}
.dhead .stats{flex:none;width:440px}
.dtitle{font-size:17px;font-weight:700;color:var(--accent-dark);display:flex;align-items:center;gap:8px;
  flex-wrap:wrap}
.dtitle .edit{font-size:12px;color:var(--muted);font-weight:400;border:1px dashed var(--border);
  border-radius:5px;padding:1px 7px;cursor:pointer}
.dtitle .edit:hover{border-color:var(--accent);color:var(--accent)}
.dsub{font-size:12px;color:var(--muted);margin-top:3px;font-family:var(--mono)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface-alt);border:1px solid var(--border);border-radius:7px;padding:9px 11px}
.stat .lb{font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.stat .lb .hintw{color:var(--accent);font-size:10.5px}
.stat .v{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--accent-dark);margin-top:2px}
.stat .v small{font-size:12px;color:var(--muted);font-weight:400}
.blood{display:flex;align-items:center;gap:8px;margin-top:8px}
.blood .bar{display:flex;gap:3px;padding:3px 5px;border-radius:5px;
  border:1px solid var(--border);background:var(--surface)}
.blood .bar .pip{width:13px;height:13px}
.legend{display:flex;gap:12px;font-size:11px;color:var(--muted);margin-top:6px;align-items:center;
  flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:8px;border-radius:2px;margin-right:5px;
  vertical-align:middle}
/* U32：大数字用输入框、小数字用 Alt+滚轮 —— 两套控件 */
.numin{width:78px;text-align:center;padding:1px 6px;border:1px dashed var(--border);
  border-radius:6px;background:var(--surface);font-family:var(--mono);font-weight:700;
  font-size:17px;color:var(--accent-dark);font-variant-numeric:tabular-nums;outline:none}
.numin:hover{border-color:var(--accent)}
.numin:focus{border-color:var(--accent);background:var(--accent-light)}
.numin.dirty{border-color:var(--accent);background:var(--accent-light)}
.numin.bad{border-color:var(--danger);background:var(--danger-light);color:var(--danger)}
.spin{font-family:var(--mono);font-size:17px;font-weight:700;color:var(--accent-dark);
  border:1px dashed var(--border);border-radius:6px;padding:2px 9px;background:var(--surface);
  cursor:ns-resize;user-select:none;white-space:nowrap;display:inline-block;
  min-width:32px;text-align:center}
.spin:hover{border-color:var(--accent);background:var(--accent-light)}
.spin.dirty{border-color:var(--accent);background:var(--accent-light)}
.spin.bad{border-color:var(--danger);background:var(--danger-light);color:var(--danger)}
.spin .u{font-size:10px;color:var(--muted);font-weight:400}
.hintline{font-size:11px;color:var(--muted);margin-top:6px}
/* 特种兵区 */
.specbox{margin-top:14px;border:1px solid var(--border);border-radius:8px;
  background:var(--surface);overflow:hidden}
.sbhead{display:flex;align-items:center;gap:10px;padding:7px 12px;background:var(--surface-alt);
  border-bottom:1px solid var(--border);flex-wrap:wrap}
.sbhead .sbt{font-size:13px;font-weight:700;color:var(--accent-dark);white-space:nowrap}
.sbhead .sbm{font-size:12px;color:var(--muted);white-space:nowrap}
.sbhead .sp{flex:1}
.sbhead .sbsep{width:1px;height:13px;background:var(--border);flex:none}
.specsplit{display:flex;align-items:stretch;min-height:0}
.specslots{display:flex;flex-direction:column;gap:7px;padding:10px 12px;width:272px;flex:none;
  border-right:1px solid var(--border);background:var(--surface)}
.slot{display:flex;align-items:center;gap:9px;padding:6px 10px 6px 6px;border:1px solid var(--border);
  border-radius:7px;background:var(--surface-alt);cursor:pointer}
.slot:hover{border-color:var(--danger);background:var(--danger-light)}
.slot:hover .slotname{color:var(--danger)}
.slot .sq{width:34px;height:34px;border-radius:5px;background:var(--stage);
  border:1px solid var(--stage-edge);display:grid;place-items:center;overflow:hidden;flex:none}
.slot .sq img{max-width:100%;max-height:100%;object-fit:contain}
.slot .slotinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.slot .slotname{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .slotflags{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.slot .slotflags .none{font-size:10.5px;color:var(--muted)}
.slot .slotstats{flex:none;display:grid;grid-template-columns:auto 2.1em;gap:1px 7px;
  align-items:baseline;justify-content:end;padding-left:6px;border-left:1px solid var(--border);
  font-size:10.5px;color:var(--muted);font-family:var(--mono);white-space:nowrap}
.slot .slotstats .st{display:contents}
.slot .slotstats .st i{font-style:normal;text-align:right}
.slot .slotstats .st b{color:var(--accent-dark);font-weight:700;font-size:11.5px;text-align:right;
  font-variant-numeric:tabular-nums}
.slot.empty{border-style:dashed;background:var(--surface);color:var(--muted);cursor:default;
  padding:5px 24px;justify-content:center}
.slot.empty:hover{border-color:var(--border);background:var(--surface)}
.ftag{display:inline-block;font-size:10px;padding:0 5px;border-radius:3px;background:var(--surface);
  border:1px solid var(--border);color:var(--muted);font-family:var(--mono);white-space:nowrap}
.specpool{display:block;max-height:340px;overflow:auto;flex:1;min-width:0}
.poolflat{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px}
.grphead{display:flex;align-items:center;gap:7px;padding:4px 12px;background:var(--surface-alt);
  border-top:1px solid var(--border);font-size:12px;font-weight:600;color:var(--accent-dark);
  cursor:pointer;user-select:none}
.grphead .caret{font-size:10px;display:inline-block}
.grphead .gcount{font-weight:400;color:var(--muted);font-size:11.5px}
.grpbody{display:flex;flex-wrap:wrap;gap:6px;padding:9px 12px}
.pcell{width:42px;height:42px;border-radius:6px;background:var(--stage);
  border:1px solid var(--stage-edge);display:grid;place-items:center;overflow:hidden;cursor:pointer}
.pcell img{max-width:100%;max-height:100%;object-fit:contain}
.pcell:hover{border-color:var(--accent);box-shadow:0 0 0 2px rgba(36,91,143,.2)}
.pcell.blocked{opacity:.35;filter:grayscale(.9);cursor:not-allowed}
.pcell.blocked:hover{border-color:var(--stage-edge);box-shadow:none}
/* 特种兵选择器（U22：商店上架 / 兵库加条目共用同一套组件） */
.spick{border:1px solid var(--border);border-radius:8px;background:var(--surface-alt);overflow:hidden}
.spick .sphd{display:flex;align-items:center;gap:9px;padding:8px 11px;
  background:var(--surface);border-bottom:1px solid var(--border)}
.spick .spt{font-size:12.5px;font-weight:700;color:var(--accent-dark);white-space:nowrap}
.spick .spc{font-size:11px;color:var(--muted);font-family:var(--mono);white-space:nowrap}
.spick .spgrid{display:flex;flex-wrap:wrap;gap:6px;padding:10px 11px;max-height:190px;overflow:auto}
.spick .spgrid .pcell{position:relative}
.spick .spgrid .pcell.on{border-color:var(--accent);background:var(--accent-light);
  box-shadow:0 0 0 2px rgba(36,91,143,.35)}
.spick .spfoot{padding:9px 11px;background:var(--surface);border-top:1px solid var(--border)}
.spick .slot.spcard{cursor:default}
.spick .slot.spcard:hover{border-color:var(--border);background:var(--surface-alt)}
.spick .slot.spcard:hover .slotname{color:inherit}
.spnat{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.spnat b{font-family:var(--mono);color:var(--accent-dark);font-weight:700;font-size:13px}
.spnat .auto{font-size:10px;padding:0 5px;border-radius:3px;background:var(--accent-light);
  border:1px solid #b9d3ea;color:var(--accent-dark)}
@media (max-width:880px){ .cols{grid-template-columns:1fr} }




/* ---------------- 商店页（U37） ---------------- */
.storegrp{margin-top:10px;border:1px solid var(--border);border-radius:7px;overflow:hidden}
.storetitle{font-size:12.5px;font-weight:600;color:var(--accent-dark);padding:7px 11px;
  background:var(--surface-alt);display:flex;align-items:center;gap:9px}
.storetitle .btn{margin-left:auto;padding:2px 10px;font-size:12px}
table.spec-tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.spec-tbl th{text-align:left;background:var(--accent-dark);color:#fff;padding:7px 10px;font-weight:600}
table.spec-tbl td{padding:6px 10px;border-bottom:1px solid #eef1f4}
table.spec-tbl tr:hover td{background:var(--accent-light)}
table.spec-tbl td.num{font-family:var(--mono);text-align:right}
table.spec-tbl td.dim{color:var(--muted)}
table.spec-tbl td.tags{white-space:nowrap}
table.spec-tbl td.tags .ftag{margin-right:4px}
table.spec-tbl .thumb{width:30px;height:30px;background:var(--stage);border:1px solid var(--stage-edge);
  border-radius:4px;display:grid;place-items:center;overflow:hidden}
table.spec-tbl .thumb img{max-width:100%;max-height:100%;object-fit:contain}
table.spec-tbl .rm{color:var(--danger);cursor:pointer;font-size:11.5px}
table.spec-tbl .numin{width:62px;font-size:13px;padding:1px 5px}
table.spec-tbl .spin{font-size:13px;padding:0 7px;min-width:30px}
/* ---------------- 战区资产页（U38） ---------------- */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:11px;padding:12px}
.titem{display:flex;gap:11px;align-items:center;background:var(--surface);
  border:1px solid var(--border);border-radius:8px;padding:9px}
.titem>img{width:60px;height:60px;flex:none;object-fit:contain}
.titem .tbody{flex:1;min-width:0}
.titem .tn{font-size:12.5px;font-weight:600;margin-bottom:2px}
.titem .trow{display:flex;align-items:baseline;gap:6px;font-size:11px;color:var(--muted);
  margin-top:3px;line-height:1.45;white-space:nowrap}
.titem .xnum{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--accent-dark);
  display:inline-flex;align-items:baseline;gap:2px}

<body>

<!-- ============ 启动页 ============ -->
<div id="splash">
  <h1>统一指挥 2 存档修改器</h1>

  <div class="picker">
    <div class="bar">
      <input id="q" placeholder="搜索存档…">
      <span style="font-size:11.5px;color:var(--muted)" id="cnt"></span>
      <button onclick="reload()">刷新</button>
    </div>
    <table class="list">
      <thead><tr><th>存档</th><th>类型</th><th>状态</th><th>最后修改</th><th style="text-align:right">大小</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none">没有匹配的存档</div>
  </div>
  <div class="note" style="width:min(1180px,100%);margin-top:14px">
    <b>界面层说明</b>：这一版是 <b>U26 技术路线</b>的落地 —— 界面 = HTML/CSS，
    Python 只起一个本地 <code>127.0.0.1</code> 服务（带随机 token），核心库
    <code>save_modifier_core</code> 负责读存档与校验。<br>
    <b>7 个页面都接的是真实数据</b>：概览 · 单位 · 总部 · 卡牌 · 商店 · 战区资产 · 战役。
    改动先进「待应用」（右下角抽屉），点「应用更改」才写盘 —— 写前自动备份、可撤销。
  </div>
</div>

<!-- ============ 主界面 ============ -->
<div id="app">
  <div class="hdr">
    <span class="logo">U2</span>
    <span class="title" id="hTitle">存档修改器</span>
    <span class="caps" id="hCaps"></span>
    <span class="sp"></span>
    <button class="btn" onclick="doUndo()">↶ 撤销</button>
    <button class="btn pri" id="btnApply" onclick="doApply()">应用更改 <span id="hPending">0</span></button>
  </div>
  <div class="body">
    <div class="rail">
      <div class="grp">功能</div>
      <div class="nav on" data-p="overview"><span class="ic">▤</span>概览</div>
      <div class="nav" data-p="units"><span class="ic">▥</span>单位</div>
      <div class="nav" data-p="hqs"><span class="ic">▧</span>总部</div>

<!-- ============ 模态框（写盘确认 / 上架 / 换牌 / 加条目） ============ -->
<div class="mask" id="mask">
  <div class="modal" id="modal"></div>
</div>

<script>
const QS = new URLSearchParams(location.search);
const TOKEN = QS.get("t") || "";
const OPEN_ID = QS.get("open") || "";
const OPEN_PAGE = QS.get("page") || "";
let SAVES = [], VIEW = null, PAGE = "overview";
let UQUERY = "", UHQFILTER = "";
let HQSTATE = {};
let MODAL = null;      /* 模态框的状态（U40） */

const FEATURE_CN = {units:"单位", hqs:"总部", hand:"手牌", shelf:"货架",
  store:"商店", theater_assets:"战区资产", restore_hand:"恢复上次会议牌局"};
const PAGE_CN = {overview:"概览", units:"单位", hqs:"总部", cards:"卡牌",
  store:"商店", theater:"战区资产", campaign:"战役"};
/* 深链 `?page=单位页名` */
if(OPEN_PAGE && PAGE_CN[OPEN_PAGE]) PAGE = OPEN_PAGE;

/* U32：禁掉 Edge 的 **Ctrl+滚轮缩放** —— 浏览器默认行为，页面可以阻止。
   实测（2026-11-18 · 本机 Edge 157）：
     · Ctrl+滚轮 ⇒ 页面缩放（devicePixelRatio 变化）⇒ **全局禁掉**；
     · Alt+滚轮  ⇒ **不缩放**（devicePixelRatio 全程 = 1）且事件照常到达页面
                    ⇒ 用它来调数值；
     · 普通滚轮 ⇒ 页面滚动，不改数值（防手滑改值）。 */
document.addEventListener("wheel", function(e){
  if(e.ctrlKey) e.preventDefault();
}, {passive:false, capture:true});

/* 全局错误显示 —— 静默失败最难查 */
window.onerror = function(msg, src, line){
  const r = document.getElementById("rows");
  if(r) r.innerHTML = `<tr><td colspan="5" style="color:var(--danger)">`
    + `JS 错误：${esc(String(msg))}（第 ${line} 行）</td></tr>`;
  return false;
};

/* 幂等编码：已经编码过的不再编码（U31 修双重编码的 bug）。
   `encodeURIComponent` 不编码 `'`（单引号）—— 存档名里有单引号会破坏 JS 字面量
   ⇒ 这里把 `'` 一并编码成 %27。 */
function encOnce(s){
  const raw = String(s??"");
  // 已经编码过的（含 %XX 且能解码回来）=> **原样返回**，不要再编码一次
  try { if(decodeURIComponent(raw) !== raw) return raw; } catch(e){}
  return encodeURIComponent(raw).replace(/'/g, "%27");
}

async function api(path){
  const r = await fetch(path, {headers:{"X-Token":TOKEN}});
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}
async function post(path, body){
  const r = await fetch(path, {method:"POST",
    headers:{"Content-Type":"application/json","X-Token":TOKEN},
    body: JSON.stringify(body)});
  return {status:r.status, data: await r.json()};
}

/* ---------- 待应用清单 ----------
   ⚠️ `key` = 编辑目标的标识（同一目标只挂一条）；
      `params` = 真正写进存档的内容（**含 value**）。
   两者必须分开 —— 拿 params 去匹配会把「值」也当成目标的一部分，
   于是改了值就匹配不上、界面永远显示原值（U34 实测踩到）。 */
let PENDING = [];          /* [{kind, key, params, label, value}] */
function setPending(kind, key, params, label, value){
  /* ⚠️ 同一 key 再改一次是**替换**，不是删除（U35 实测踩到：
     「切换」语义会让 CP 从 7 再滚到 8 时把改动整个删掉）。 */
  const i = PENDING.findIndex(x => x.kind===kind && x.key===key);
  const entry = {kind:kind, key:key, params:params, label:label};
  /* ⚠️ 值单独存一份 —— 各 kind 的 params 里值的字段名不一样
     （unit_field 是 value、hq_trucks 是 trucks），
     统一从 entry.value 取，界面才不会读到 undefined。 */
  if(value !== undefined) entry.value = value;
  if(i>=0) PENDING[i] = entry; else PENDING.push(entry);
  paintPending();
}
function paintPending(){
  const el = document.getElementById("pendList");
  if(el){
    el.innerHTML = PENDING.map((p,i)=>`<li><span class="d">${esc(p.label)}</span>
      <span class="x" onclick="dropPending(${i})">移除</span></li>`).join("")
      || `<li style="color:var(--muted)">（没有待应用的改动）</li>`;
    const cnt = document.getElementById("pendCount");
    if(cnt) cnt.textContent = PENDING.length;
  }
  const hp = document.getElementById("hPending");
  if(hp) hp.textContent = PENDING.length;
  const ba = document.getElementById("btnApply");
  if(ba) ba.disabled = !PENDING.length;
  const dr = document.getElementById("drawer");
  if(dr) dr.classList.toggle("empty", !PENDING.length);
}
function dropPending(i){ PENDING.splice(i,1); paintPending(); }

/* ---------- 数值控件（U32） ----------
   大数字（三位以上：声望/分数/经验）= 可直接编辑的输入框（+ Alt+滚轮 ±1）
   小数字（一般个位数：CP/卡车数/延迟/库存/战力步数）= 只给 Alt+滚轮 ±1
   —— 滚轮键位统一用 Alt：Ctrl+滚轮 是 Edge 的页面缩放（全局已禁掉），
      Alt+滚轮 实测不缩放且事件照常到达页面。 */
const TUN_RANGE = {prestige:[0, null], score:[0, null]};   /* null = 无上限 */

/* Alt+滚轮 ±1（U32）
   —— 普通滚轮**不改值**（照常滚页面，避免手滑误改）；
   —— Alt+滚轮 才调值，并阻止页面跟着滚。 */
function altWheel(el, fn){
  el.addEventListener("wheel", function(ev){
    if(!ev.altKey) return;
    ev.preventDefault();
    fn(ev.deltaY>0 ? -1 : 1);
  }, {passive:false});
}

function bindTun(){
  document.querySelectorAll(".tun .num").forEach(el=>{
    const f = el.dataset.f;
    const base = f==="prestige" ? (VIEW.prestige||0) : (VIEW.score||0);
    el.value = base;
    document.getElementById("o_"+f).textContent = "原值 " + base;

    /* Alt+滚轮 ±1（带范围夹取）；普通滚轮不改值 */
    altWheel(el, function(d){
      const [lo, hi] = TUN_RANGE[f] || [0, null];
      const cur = parseInt(el.value, 10);
      let v = (isFinite(cur) ? cur : 0) + d;
      if(lo!==null && v < lo) v = lo;
      if(hi!==null && v > hi) v = hi;
      el.value = v;
      apply();
    });

    function apply(){
      const raw = String(el.value??"").trim();
      const v = Number(raw);
      const [lo, hi] = TUN_RANGE[f] || [0, null];
      let bad = null;
      if(raw==="") bad = "不能为空";
      else if(!/^-?\d+$/.test(raw)) bad = "必须是整数";
      else if(!Number.isSafeInteger(v)) bad = "数字太大了";
      else if(v < lo) bad = "不能小于 " + lo;
      else if(hi!==null && v > hi) bad = "不能大于 " + hi;
      el.classList.toggle("bad", !!bad);
      el.title = bad || "";
      if(bad){                              /* 非法值 ⇒ 不入待应用 */
        dropPendingKind("progress", f);
        return;
      }
      el.classList.toggle("dirty", v !== base);
      const params = {field: f, value: v};
      if(v === base){
        dropPendingKind("progress", f);
      } else {
        setPending("progress", f, params, `${f==="prestige"?"声望":"分数"} ${base} → ${v}`);
      }
      paintPending();
    }
    el.addEventListener("input", apply);
    el.addEventListener("change", apply);
    el.addEventListener("keydown", ev=>{ if(ev.key==="Enter"){ ev.preventDefault(); apply(); el.blur(); } });
  });
}

/* 贴图：必须走服务端代理（http 页面读不到 file://）—— U29
   `/surfaces/*` 要 token ⇒ 只能走 query（<img> 带不了 header）。 */
function surf(p){
  return "/surfaces/" + String(p||"") + "?t=" + encodeURIComponent(TOKEN);
}
function imgTag(p, alt){
  return `<img src="${surf(p)}" alt="${esc(alt||"")}" loading="lazy">`;
}
const unitTex  = t => "unit/" + t + "/sheet_L.png";
const specTex  = t => "specialist/" + t + "/hq_action_icon.png";
const specBig  = t => "specialist/" + t + "/sheet_large.png";

function unitCn(type){ return (CATALOG&&CATALOG.unit_types[type]||{}).cn || type || "?"; }
function specCn(type){ return (CATALOG&&CATALOG.spec_types[type]||{}).cn || type || "?"; }
function natCn(nat){ return (CATALOG&&CATALOG.nationalities[nat]||{}).cn || nat || "?"; }

async function loadCatalog(){
  if(!CATALOG) CATALOG = await api("/api/catalog");
  return CATALOG;
}
async function loadPickers(unitType){
  const k = unitType || "";
  if(PICKCACHE[k]) return PICKCACHE[k];
  const q = "?save_id=" + encOnce(VIEW._save_id) + (unitType ? "&unit_type=" + encOnce(unitType) : "");
  PICKCACHE[k] = await api("/api/pickers" + q);
  PICK = PICKCACHE[k];
  return PICK;

/* 待应用里的「覆盖值」：有挂起的编辑就显示编辑后的值，否则显示存档原值 */
function pendingVal(kind, key, cur){
  const i = PENDING.findIndex(x => x.kind===kind && x.key===key);
  if(i<0) return cur;
  const e = PENDING[i];
  if(e.value !== undefined) return e.value;
  return (e.params.value !== undefined) ? e.params.value : cur;
}
function pendingHit(kind, key){
  return PENDING.some(x => x.kind===kind && x.key===key);
}
/* 取消一条挂起的编辑（值回到原值时用） */
function dropPendingKind(kind, key){
  const i = PENDING.findIndex(x => x.kind===kind && x.key===key);
  if(i>=0){ PENDING.splice(i,1); paintPending(); }
}

/* ---------- 通用数值控件 ----------
   大数字（三位以上）= 输入框（可直接编辑）
   小数字（一般个位数）= Alt+滚轮 ±1（U32 用户拍板） */

/* 小数字：Alt+滚轮 ±1，带范围夹取
   ⚠️ `base` = **存档原值**（比较与文案都用它）；
      `cur`  = 当前该显示的值（挂起了改动就显示挂起值，缺省 = base）。 */
function bindSpin(el, opts){
  const base = opts.base;
  const cur0 = (opts.cur===undefined) ? base : opts.cur;
  function show(v){
    el.textContent = v;
    el.classList.toggle("dirty", v!==base);
    el.classList.toggle("bad", false);
  }
  function commit(v){
    if(opts.min!==undefined && opts.min!==null && v<opts.min) v=opts.min;
    if(opts.max!==undefined && opts.max!==null && v>opts.max) v=opts.max;
    show(v);
    opts.onChange(v);
  }
  altWheel(el, function(d){
    const cur = parseInt(String(el.textContent).replace(/\D/g,""), 10);
    commit((isFinite(cur)?cur:base) + d);
  });
  show(cur0);
}

/* 大数字：输入框，直接编辑 */
function bindNumIn(el, opts){
  const base = opts.base;      /* 存档原值 */
  let init = true;             /* 初始化时**不触发回调** */
  function apply(){
    const raw = String(el.value??"").trim();
    const v = Number(raw);
    let bad = null;
    if(raw==="") bad = "不能为空";
    else if(!/^-?\d+$/.test(raw)) bad = "必须是整数";
    else if(!Number.isSafeInteger(v)) bad = "数字太大了";
    else if(opts.min!==undefined && opts.min!==null && v<opts.min) bad = "不能小于 " + opts.min;
    else if(opts.max!==undefined && opts.max!==null && v>opts.max) bad = "不能大于 " + opts.max;
    el.classList.toggle("bad", !!bad);
    el.title = bad || "";
    if(bad){ dropPendingKind(opts.kind, opts.key); return; }
    el.classList.toggle("dirty", v!==base);
    /* ⚠️ 初始化**不**触发回调 —— 回调里往往会重绘页面，
       初始化就回调 ⇒ 重绘 → 重新 bind → 再回调 ⇒ **无限递归**（U38 实测）。 */
    if(init){ init = false; return; }
    opts.onChange(v);
  }
  el.addEventListener("input", apply);
  el.addEventListener("change", apply);
  el.addEventListener("keydown", ev=>{ if(ev.key==="Enter"){ ev.preventDefault(); apply(); el.blur(); } });
  apply();
}

/* 把一次编辑挂到「待应用」；值等于原值就撤掉 */
function queueEdit(kind, key, params, base, value, label){
  if(value === base){ dropPendingKind(kind, key); return; }
  setPending(kind, key, params, `${label} ${base} → ${value}`, value);
}

/* 编辑目标的标识（同一个目标只挂一条待应用） */

function projectedSpecs(u){
  /* 已挂的特种兵 + 「待应用」里新加/卸下的（还没写盘，先在界面上体现） */
  const specs = (u.specs||[]).map(s => Object.assign({}, s));
  PENDING.forEach(p=>{
    if(p.kind==="unit_spec_add" && p.params.unit_id===u.id){
      if(!specs.some(s=>s.type===p.params.spec_type))
        specs.push({idx:specs.length, type:p.params.spec_type, active:true, captured:false});
    }
    if(p.kind==="unit_spec_remove" && p.params.unit_id===u.id){
      const i = specs.findIndex(s => s.type===p.params.spec_type &&
        (p.params.idx===undefined || p.params.idx===null || s.idx===p.params.idx));
      if(i>=0) specs.splice(i,1);
    }
  });
  return specs;
}

const BRANCHES = ["engineering", "force_pool", "intel", "logistics", "operations"];
const BRANCH_CN = {engineering:"工程", force_pool:"兵库", intel:"情报",
  logistics:"后勤", operations:"作战"};
const TRUCK_RANGE = [5, 8, 10, 11, 12];
const hqKey = (id, field) => `hq_field:${id}:${field}`;
const hqBrKey = (id, br) => `hq_branch_level:${id}:${br}`;
const hqSpKey = (id, br, act) => `hq_branch_sp:${id}:${br}:${act}`;
const hqPoolKey = (id, i) => `hq_force_pool:${id}:${i}`;

function hqSkillCn(act){ return (VIEW.skills||{})[act] || act; }
function hqGeneralCn(g){
  const gg = (VIEW.generals||{})[g];
  return gg ? (gg.cn || g) : (g || "");
}
function hqEquipCn(e){ return (VIEW.equipment_cn||{})[e] || e; }

/* 兵库的「投影」：把待应用里的加/删先算上，界面上才看得到 */
function projectedPool(h){
  const pool = (h.force_pool||[]).map(e=>Object.assign({}, e));
  PENDING.forEach(p=>{
    if(p.kind==="hq_force_pool_add" && p.params.hq_id===h.id)
      pool.push(Object.assign({}, p.params.entry));
    if(p.kind==="hq_force_pool_remove" && p.params.hq_id===h.id){
      const i = p.params.index;
      if(i>=0 && i<pool.length) pool.splice(i,1);
    }
  });
  return pool;
}

function hqRowHTML(h){
  const cp = pendingVal("hq_field", hqKey(h.id,"cp"), h.cp||0);
  const mx = pendingVal("hq_field", hqKey(h.id,"max_cp"), h.max_cp||0);
  const xp = pendingVal("hq_field", hqKey(h.id,"xp"), h.xp||0);
  const xt = pendingVal("hq_field", hqKey(h.id,"xp_target"), h.xp_target||0);
  const pct = xt ? Math.max(0, Math.min(100, Math.round(xp*100/xt))) : 0;
  return `<div class="hqrow ${h.id===SEL.hqs?'on':''}" onclick="pickHq(${h.id})">
    <div class="nm"><b>${esc(h.name_cn||h.name_brief||("总部 "+h.id))}</b>
      <span>CP ${cp}/${mx} · 经验 ${xp}/${xt||"—"}</span>
      <div class="expbar"><i style="width:${pct}%"></i></div></div>
  </div>`;
}
function pickHq(id){ SEL.hqs = id; show("hqs"); }

function hqSkillHTML(h, br, it){
  const act = it.action;
  const cn = hqSkillCn(act);
  const used = pendingVal("hq_branch_sp", hqSpKey(h.id,br,act), it.sp_used||0);
  const avail = it.sp_avail;
  const dots = [];
  const n = (typeof avail==="number") ? avail : 0;
  for(let i=0;i<n;i++) dots.push(`<i class="${i<used?'on':''}"></i>`);
  const brLevel = pendingVal("hq_branch_level", hqBrKey(h.id,br),
    ((h.branch_levels||{})[br]||{}).level||0);
  const locked = (it.level||1) > brLevel;
  return `<div class="sk ${locked?'locked':''}" title="${esc(cn)} · CP 消耗 ${it.cost??0}${
    avail!==null&&avail!==undefined ? (" · 专精 "+used+"/"+avail) : " · 没有技能点"}"
    ${locked ? "（未解锁）" : "（点击：专精次数 +1，到顶后回到 0）"}"
    onclick="${locked?'void 0':('hqSpecialize('+h.id+','+esc(JSON.stringify(br))+','+esc(JSON.stringify(act))+','+used+','+(avail===null||avail===undefined?-1:avail)+')')}">
    ${imgTag("hq_upgrade/hq_upgrade_"+act+"_on.png", cn)}
    <span class="cost">${it.cost??0}</span>
    ${dots.length?`<span class="dots">${dots.join("")}</span>`:""}
    <span class="nm">${esc(cn)}</span>
  </div>`;
}

function hqMatrixHTML(h){
  const bl = h.branch_levels||{};
  const brs = h.branches||{};
  const rows = BRANCHES.map(br=>{
    const node = bl[br]||{};
    const lvl = pendingVal("hq_branch_level", hqBrKey(h.id,br), node.level||0);
    const sup = pendingVal("hq_branch_level", hqBrKey(h.id,br)+":sup", node.suppressed||0);
    const cells = [1,2,3].map(lv=>{
      const items = (brs[br]||[]).filter(it=>it && it.level===lv);
      if(!items.length) return `<div class="mx-cell na">—</div>`;
      return `<div class="mx-cell">${items.map(it=>hqSkillHTML(h,br,it)).join("")}</div>`;
    }).join("");
    return `<div class="mx-row">
      <div class="mx-branch">
        <div class="bn">${esc(BRANCH_CN[br]||br)}</div>
        <div class="lvctl"><button onclick="hqBranchLevel(${h.id},'${br}',-1)">−</button>
          <b>${lvl}</b>
          <button onclick="hqBranchLevel(${h.id},'${br}',1)">+</button></div>
        <div class="supctl">压制
          <button onclick="hqSuppress(${h.id},'${br}',-1)">−</button>
          <b class="${sup?'on':''}">${sup}</b>
          <button onclick="hqSuppress(${h.id},'${br}',1)">+</button></div>
      </div>${cells}</div>`;
  }).join("");
  return `<div class="matrix">
    <div class="mx-head"><div class="h-branch">分支 / 等级</div><div>1 级</div>
      <div>2 级</div><div>3 级</div></div>${rows}</div>`;
}

function hqPoolHTML(h){
  const pool = projectedPool(h);
  if(!pool.length) return `<div class="fpool"><div class="fptitle">兵库</div>
    <div style="padding:10px 11px;color:var(--muted);font-size:12px">兵库是空的</div></div>`;
  /* 按延迟分组（游戏是分批上线的） */
  const groups = {};
  pool.forEach((e,i)=>{
    const d = e.delay||0;
    (groups[d]=groups[d]||[]).push([i,e]);
  });
  const delays = Object.keys(groups).map(Number).sort((a,b)=>a-b);
  let body = "";
  delays.forEach(d=>{
    body += `<tr class="fdelay"><td colspan="6">延迟 <b>${d}</b> 回合 —— 这一批要等 ${d} 个回合才能部署</td></tr>`;
    groups[d].forEach(([i,e])=>{
      const isSpec = !!e.spec;
      const nm = isSpec ? specCn(e.spec) : hqEquipCn(e.equipment);
      const st = isSpec ? ((CATALOG&&CATALOG.spec_types[e.spec])||{}) : {};
      const q = pendingVal("hq_force_pool", hqPoolKey(h.id,i), e.quantity||0);
      const tags = isSpec ? (st.flags||[]).map(f=>`<span class="ftag">${esc(f)}</span>`).join("") : "";
      body += `<tr>
        <td class="l"><div class="thumb">${isSpec?imgTag(specTex(e.spec), nm)
          :imgTag("steps/step.png", nm)}</div></td>
        <td class="l name">${esc(nm)}
          ${isSpec?`<span class="ro">${esc(st.cn||"")}</span>`:""}</td>
        <td class="dim">${esc(natCn(e.nationality))}</td>
        <td class="dim">${isSpec?esc(st.attack??"—"):"—"} / ${isSpec?esc(st.defense??"—"):"—"} /
          ${isSpec?esc(st.armor??"—"):"—"}</td>
        <td class="tags">${tags}</td>
        <td><span class="spin" id="fp_q_${h.id}_${i}"></span></td>
        <td><span class="rm" onclick="hqPoolRemove(${h.id},${i})">移除</span></td>
      </tr>`;
    });
  });
  return `<div class="fpool">
    <div class="fptitle">兵库 · 共 ${pool.length} 条
      <span style="font-weight:400;font-size:11.5px;color:var(--muted)">
        同一个总部里，同样的条目 + 同样的延迟不许并存（延迟不同可以共存）</span>
      <button class="btn" style="margin-left:auto;padding:3px 10px;font-size:12px"
        onclick="toggleHqPicker(${h.id})">${SEL.hqPicker===h.id?"收起":"加条目"}</button>
    </div>
    <table class="fptab">
      <thead><tr><th class="l">图</th><th class="l">名称</th><th>国籍</th>
        <th>攻 / 防 / 装</th><th>特性</th><th>数量</th><th></th></tr></thead>
      <tbody>${body}</tbody></table></div>`;
}

function bindHqControls(h){
  const ids = ["cp","max_cp","supply"];
  const spin = (elId, field, cur, min, max, label, base)=>{
    const el = document.getElementById(elId);
    if(!el) return;
    bindSpin(el, {base:(base===undefined?cur:base), cur, min, max, onChange(v){
      queueEdit("hq_field", hqKey(h.id, field),
        {hq_id:h.id, field, value:v}, (base===undefined?cur:base), v, `总部 ${h.id} ${label}`);
      SEL.hqs = h.id; show("hqs");
    }});
  };
  const cpc = pendingVal("hq_field", hqKey(h.id,"cp"), h.cp||0);
  const mxc = pendingVal("hq_field", hqKey(h.id,"max_cp"), h.max_cp||0);
  const spc = pendingVal("hq_field", hqKey(h.id,"supply"), h.supply||0);
  spin("h_cp_"+h.id, "cp", cpc, 0, 9, "CP", h.cp||0);
  spin("h_mcp_"+h.id, "max_cp", mxc, 3, 9, "CP 上限", h.max_cp||0);
  spin("h_sup_"+h.id, "supply", spc, 0, 3, "补给", h.supply||0);

  const xpEl = document.getElementById("h_xp_"+h.id);
  if(xpEl) bindNumIn(xpEl, {base:h.xp||0, cur:pendingVal("hq_field", hqKey(h.id,"xp"), h.xp||0), min:0, max:null,
    kind:"hq_field", key:hqKey(h.id,"xp"), params:{hq_id:h.id, field:"xp", value:xpEl.value},
    onChange(v){ queueEdit("hq_field", hqKey(h.id,"xp"),
      {hq_id:h.id, field:"xp", value:v}, h.xp||0, v, `总部 ${h.id} 经验`); }});
  const xtEl = document.getElementById("h_xt_"+h.id);
  if(xtEl) bindNumIn(xtEl, {base:h.xp_target||0, cur:pendingVal("hq_field", hqKey(h.id,"xp_target"), h.xp_target||0), min:0, max:null,
    kind:"hq_field", key:hqKey(h.id,"xp_target"), params:{hq_id:h.id, field:"xp_target", value:xtEl.value},
    onChange(v){ queueEdit("hq_field", hqKey(h.id,"xp_target"),
      {hq_id:h.id, field:"xp_target", value:v}, h.xp_target||0, v, `总部 ${h.id} 经验目标`); }});

  /* 兵库数量（每条一个 Alt+滚轮控件） */
  const pool = projectedPool(h);
  pool.forEach((e,i)=>{
    const el = document.getElementById("fp_q_"+h.id+"_"+i);
    if(!el) return;
    bindSpin(el, {base:e.quantity||0, cur:pendingVal("hq_force_pool", hqPoolKey(h.id,i), e.quantity||0), min:0, max:null,
      onChange(v){
        queueEdit("hq_force_pool", hqPoolKey(h.id,i),
          {hq_id:h.id, index:i, quantity:v}, e.quantity||0, v,
          `总部 ${h.id} 兵库第 ${i+1} 条数量`);
        SEL.hqs = h.id; show("hqs");
      }});
  });
}

function commitRenameHq(id){

  const h = (VIEW.hqs||[]).find(x=>x.id===id); if(!h) return;
  const v = el.value.trim();

function hqTrucks(id, n){
  const h = (VIEW.hqs||[]).find(x=>x.id===id); if(!h) return;
  const base = pendingVal("hq_trucks", `hq_trucks:${id}`, h.trucks||0);
  queueEdit("hq_trucks", `hq_trucks:${id}`,
    {hq_id:id, trucks:n}, base, n, `总部 ${id} 补给卡车`);

}

function hqBranchLevel(id, br, d){
  const h = (VIEW.hqs||[]).find(x=>x.id===id); if(!h) return;
  const node = ((h.branch_levels||{})[br]||{});
  const cur = pendingVal("hq_branch_level", hqBrKey(id,br), node.level||0);
  let v = cur + d;
  if(v<0) v=0; if(v>3) v=3;
  queueEdit("hq_branch_level", hqBrKey(id,br),
    {hq_id:id, branch:br, level:v}, node.level||0, v, `总部 ${id} ${BRANCH_CN[br]||br} 等级`);
  show("hqs");
}
function hqSuppress(id, br, d){
  const h = (VIEW.hqs||[]).find(x=>x.id===id); if(!h) return;
  const node = ((h.branch_levels||{})[br]||{});
  const cur = pendingVal("hq_branch_level", hqBrKey(id,br)+":sup", node.suppressed||0);
  const lvl = pendingVal("hq_branch_level", hqBrKey(id,br), node.level||0);
  let v = cur + d;
  if(v<0) v=0; if(v>3-lvl) v=3-lvl;      /* 等级 + 压制 ≤ 3 */
  queueEdit("hq_branch_level", hqBrKey(id,br)+":sup",
    {hq_id:id, branch:br, level:lvl, suppressed:v}, node.suppressed||0, v,
    `总部 ${id} ${BRANCH_CN[br]||br} 被压制等级`);
  show("hqs");
}
function hqSpecialize(id, br, act, used, avail){
  if(avail<0) return;
  const h = (VIEW.hqs||[]).find(x=>x.id===id); if(!h) return;
  let v = used+1; if(v>avail) v = 0;      /* 到顶后回到 0（循环） */
  const items = ((h.branches||{})[br]||[]).filter(it=>it&&it.action===act);
  const it = items[0]||{};
  queueEdit("hq_branch_sp", hqSpKey(id,br,act),
    {hq_id:id, branch:br, action:act, sp_used:v}, it.sp_used||0, v,
    `总部 ${id} ${hqSkillCn(act)} 专精`);
  show("hqs");
}
function hqPoolAdd(id, specType){
  const st = (CATALOG&&CATALOG.spec_types[specType])||{};
  const entry = {spec: specType, nationality: st.nationality||"", quantity:1, delay:0};
  setPending("hq_force_pool_add", `hq_force_pool_add:${id}:${specType}`,
    {hq_id:id, entry}, `总部 ${id} 兵库加 ${specCn(specType)}`);
  show("hqs");
}
function hqPoolRemove(id, index){
  const h = (VIEW.hqs||[]).find(x=>x.id===id); if(!h) return;
  const pool = (h.force_pool||[]);
  const e = pool[index]||{};
  const nm = e.spec ? specCn(e.spec) : hqEquipCn(e.equipment);
  setPending("hq_force_pool_remove", `hq_force_pool_remove:${id}:${index}`,
    {hq_id:id, index}, `总部 ${id} 兵库移除 ${nm}`);
  show("hqs");
}

function cardCn(type){ return cardInfo(type).cn || type || "?"; }
function cardImg(type){
  const i = cardInfo(type);
  return i.image_resolved || (i.image ? i.image + ".png" : ("cards/" + type + ".png"));
}

/* 手牌 / 货架 —— 挂起的新增/移除先算上（界面马上能看到） */
function projectedCards(list, kind){
  const out = (list||[]).map(c=>Object.assign({}, c));
  PENDING.forEach(p=>{
    if(p.kind==="card_add" && kind==="hand")
      out.push({card_type:p.params.card_type, position:p.params.position,
                is_free:!!p.params.is_free, unit_id:null, used:false, _new:true});
    if(p.kind==="card_remove" && kind==="hand"){
      const i = out.findIndex(c=>c.position===p.params.position);
      if(i>=0) out.splice(i,1);
    }
    if(p.kind==="card_store_add" && kind==="shelf")
      out.push({card_type:p.params.card_type, position:p.params.position,
                is_free:!!p.params.is_free, unit_id:null, used:false, _new:true});
    if(p.kind==="card_store_remove" && kind==="shelf"){
      const i = out.findIndex(c=>c.position===p.params.position);
      if(i>=0) out.splice(i,1);
    }
  });
  return out;
}

function cardTileHTML(c, kind){
  const free = c.is_free;
  return `<div class="hcard">
    <div class="ci">${imgTag(cardImg(c.card_type), cardCn(c.card_type))}</div>
    <div class="cp"><b>${esc(cardCn(c.card_type))}</b>${free?" · 免费":""}</div>
    <div class="cp" style="margin-top:1px">${esc(cardInfo(c.card_type).subtitle||"")}</div>
    <button class="btn rm" onclick="${kind==="hand"
      ? ("cardRemove("+c.position+")") : ("cardStoreRemove("+c.position+")")}">
      ${kind==="hand"?"从手牌移除":"下架"}</button>
  </div>`;
}

/* 卡牌选择器现在走**模态框**（U40b） */

function cardAdd(type){

  const limit = VIEW.hand_limit || 5;      /* ⚠️ 上限跟难度走（classic 只有 4 张） */
  let pos = null;
  for(let p=1;p<=limit;p++){ if(!used.has(p)){ pos=p; break; } }
  if(pos===null){ SEL.cardErr = "手牌已满 —— 先删一张再添加"; show("cards"); return; }
  setPending("card_add", `card_add:${pos}`,
    {card_type:type, position:pos, is_free:false}, `手牌加 ${cardCn(type)}（槽位 ${pos}）`);
  SEL.cardPicker = null;
  show("cards");
}

  const c = (VIEW.hand||[]).find(x=>x.position===position);

    {position}, `手牌移除 ${c?cardCn(c.card_type):("槽位 "+position)}`);
  show("cards");
}
function cardStoreAdd(position, type){

}

}
function cardStoreSet(position, type){

function storeEntryCn(e){
  if(e.spec) return specCn(e.spec);
  if(e.equipment) return hqEquipCn(e.equipment);

}
function storeKey(front, sub, index, field){
  return `store_set:${front}:${sub}:${index}:${field}`;
}
function projectedStore(){
  const out = [];
  (VIEW.store||[]).forEach((e,i)=>out.push({e:Object.assign({}, e), index:i, _new:false}));
  PENDING.forEach(p=>{

      out.push({e:Object.assign({}, p.params.entry), index:out.length, _new:true});
    }
    if(p.kind==="store_remove"){
      const i = out.findIndex(x=>x.e.front===p.params.front &&
        x.e.sub===p.params.sub && x.index===p.params.index);
      if(i>=0) out.splice(i,1);
    }
  });

}

function pageStore(w){
  const rows = projectedStore();
  const fronts = [];
  rows.forEach(r=>{
    if(!fronts.some(f=>f.front===r.e.front)) fronts.push({front:r.e.front, subs:[]});
  });
  fronts.forEach(f=>{
    rows.forEach(r=>{ if(r.e.front===f.front && !f.subs.some(s=>s.sub===r.e.sub)) f.subs.push({sub:r.e.sub}); });
  });
  if(!fronts.length){
    w.innerHTML = `<div class="panel"><h3>商店</h3><div class="placeholder">

    return;
  }
  if(!SEL.storeFront || !fronts.some(f=>f.front===SEL.storeFront)) SEL.storeFront = fronts[0].front;
  const cur = fronts.find(f=>f.front===SEL.storeFront);
  if(!SEL.storeSub || !cur.subs.some(s=>s.sub===SEL.storeSub)) SEL.storeSub = cur.subs[0].sub;

  const tabs = fronts.map(f=>`<div class="tb ${f.front===SEL.storeFront?'on':''}"

  const items = rows.filter(r=>r.e.front===SEL.storeFront && r.e.sub===SEL.storeSub);
  const body = items.map(({e,index})=>{
    const isSpec = !!e.spec;
    const st = isSpec ? ((CATALOG&&CATALOG.spec_types[e.spec])||{}) : {};
    const price = pendingVal("store_set", storeKey(e.front,e.sub,index,"price"), e.price||0);
    const qty = pendingVal("store_set", storeKey(e.front,e.sub,index,"quantity"), e.quantity||0);
    const tags = isSpec ? (st.flags||[]).map(f=>`<span class="ftag">${esc(f)}</span>`).join("") : "";
    const tex = isSpec ? specTex(e.spec) : "steps/step.png";
    return `<tr>

      <td>${esc(storeEntryCn(e))}<div style="color:var(--muted);font-size:10.5px">${esc(e.spec||e.equipment||"")}</div></td>
      <td class="dim">${esc(natCn(e.nationality))}</td>
      <td class="dim">${isSpec?esc(st.attack??"—"):"—"} / ${isSpec?esc(st.defense??"—"):"—"} /
        ${isSpec?esc(st.armor??"—"):"—"} / ${isSpec?esc(st.artillery??"—"):"—"}</td>
      <td class="tags">${tags}</td>
      <td class="num"><input class="numin" id="st_p_${e.front}_${e.sub}_${index}" type="text"
        inputmode="numeric" autocomplete="off" value="${price}"></td>
      <td class="num"><span class="spin" id="st_q_${e.front}_${e.sub}_${index}"></span></td>
      <td><span class="rm" onclick="storeRemove('${e.front}','${e.sub}',${index})">下架</span></td>
    </tr>`;
  }).join("");

  w.innerHTML = `<div class="panel"><h3>商店</h3><div class="pbody">
    <div class="tabs">${tabs}</div>
    <div class="tabs">${subtabs}</div>
    <div class="storegrp">
      <div class="storetitle">${esc(SEL.storeFront)} / ${esc(SEL.storeSub==="elite_store"?"精英商店":"普通商店")}
        · ${items.length} 条
        <button class="btn" onclick="toggleStorePicker()">${SEL.storePicker?"收起":"上架新商品"}</button></div>
      <table class="spec-tbl">
        <thead><tr><th>图</th><th>商品</th><th>国籍</th><th>攻 / 防 / 装 / 炮</th>
          <th>特性</th><th style="text-align:right">价格</th>
          <th style="text-align:right">库存</th><th></th></tr></thead>

      </table>
    </div>
    <div class="note">同一个 <b>(战线, 子商店)</b> 里<b>任何重复条目都不许</b>
      （价格库存不同也算重复）；要改已有条目就直接改那一行。<br>
      <b>库存不能填 0</b> —— 游戏没有「售罄」标记，下架请用「下架」按钮删条目。</div>
  </div></div>`;

  items.forEach(({e,index})=>{
    const pEl = document.getElementById("st_p_"+e.front+"_"+e.sub+"_"+index);
    if(pEl) bindNumIn(pEl, {base:e.price||0, cur:pendingVal("store_set", storeKey(e.front,e.sub,index,"price"), e.price||0),
      min:0, max:null, kind:"store_set", key:storeKey(e.front,e.sub,index,"price"),
      params:{front:e.front, sub:e.sub, index, field:"price", value:pEl.value},
      onChange(v){ queueEdit("store_set", storeKey(e.front,e.sub,index,"price"),
        {front:e.front, sub:e.sub, index, field:"price", value:v}, e.price||0, v,
        `商店 ${e.front}/${e.sub} 第 ${index+1} 条价格`); }});
    const qEl = document.getElementById("st_q_"+e.front+"_"+e.sub+"_"+index);
    if(qEl) bindSpin(qEl, {base:e.quantity||0, cur:pendingVal("store_set", storeKey(e.front,e.sub,index,"quantity"), e.quantity||0),
      min:1, max:null, onChange(v){

        show("store");
      }});
  });
}

function theaterCn(a){ return (VIEW.theater_cn||{})[a] || a; }
function theaterKey(asset){ return `theater_asset:${asset}`; }
function theaterCur(asset){
  const a = (VIEW.theater_assets||[]).find(x=>x.asset===asset) || {};
  const p = PENDING.find(x=>x.kind==="theater_asset" && x.key===theaterKey(asset));
  const base = {to_use:a.to_use, uses_total:a.uses_total, uses_turn:a.uses_turn};
  if(!p) return base;
  return {to_use:p.params.to_use, uses_total:p.params.uses_total, uses_turn:p.params.uses_turn};
}
function theaterSet(asset, field, value){
  const a = (VIEW.theater_assets||[]).find(x=>x.asset===asset) || {};
  const cur = theaterCur(asset);
  const params = {asset, to_use:cur.to_use, uses_total:cur.uses_total, uses_turn:cur.uses_turn};
  params[field] = value;
  const base = a[field];
  queueEdit("theater_asset", theaterKey(asset), params, base, value,
    `战区资产 ${theaterCn(asset)} ${theaterFieldCn(field)}`);
  show("theater");
}
const theaterFieldCn = {to_use:"当前可用", uses_total:"本场景剩余", uses_turn:"每回合恢复"};

function openModal(html, opts){
  opts = opts || {};
  const m = document.getElementById("modal");
  m.className = "modal" + (opts.cls ? (" " + opts.cls) : "");
  m.innerHTML = html;
  document.getElementById("mask").classList.add("on");
  if(opts.onOpen) opts.onOpen();
}
function closeModal(){
  document.getElementById("mask").classList.remove("on");
  document.getElementById("modal").innerHTML = "";
  MODAL = null;
  if(VIEW) show(PAGE);
}
document.addEventListener("keydown", function(ev){
  if(ev.key==="Escape" && document.getElementById("mask").classList.contains("on")) closeModal();
});
document.getElementById("mask").addEventListener("mousedown", function(ev){
  if(ev.target===this) closeModal();          /* 点遮罩 = 取消 */
});

/* ---------- 写盘确认框（设计稿 §9） ---------- */
function planFiles(changes){
  const out = [];
  (changes||[]).forEach(c=>{
    let row = out.find(x=>x.entry===c.entry);
    if(!row){ row = {entry:c.entry, notes:[]}; out.push(row); }
    (c.notes||[]).forEach(n=>row.notes.push(n));
  });
  return out;
}
function openConfirm(mode, info){
  const files = planFiles(info.changes);
  let title, body, foot;
  if(mode==="error"){
    title = `✕ 无法应用：${(info.errors||[]).length} 处错误`;
    body = `<div>${(info.errors||[]).map(e=>`<div class="erow">✕ ${esc(e)}</div>`).join("")}</div>
      <div class="fine">硬拦：<b>plan.errors</b> 非空时按钮禁用 —— <b>原存档不会被写入</b>。</div>`;
    foot = `<button class="btn" onclick="closeModal()">返回修改</button>
      <button class="btn pri" disabled>应用更改</button>`;
  } else if(mode==="warn"){
    title = `⚠ 有 ${(info.warnings||[]).length} 条软警告`;
    body = `<div>${(info.warnings||[]).map(w=>`<div class="wrow">⚠ ${esc(w)}</div>`).join("")}</div>
      <div class="fine">软警告：照写，只是提醒。</div>`;
    foot = `<button class="btn" onclick="closeModal()">取消</button>
      <button class="btn pri" onclick="reallyApply()">仍然应用</button>`;
  } else {
    title = `⚠ 应用 ${files.length} 处改动？`;
    body = `<div>将改动存档 <b>${esc(info.save_name||VIEW.save&&VIEW.save.name||"")}</b> 里的：</div>
      <div class="elist">${files.map(f=>`<div><span class="f">${esc(f.entry)}</span>${
        f.notes.length?`<span class="d">${esc(f.notes.join("；"))}</span>`:""}</div>`).join("")}</div>
      <div class="fine">写回前会自动备份：<b>${esc(info.backup||"（原文件保留为 _BACKUP）")}</b>
        （同名已存在则递增为 <b>_BACKUP_2</b>）· 改动后仍可一键撤销。</div>`;
    foot = `<button class="btn" onclick="closeModal()">取消</button>
      <button class="btn pri" onclick="reallyApply()">应用更改</button>`;
  }
  openModal(`<div class="mh">${title}</div><div class="mb">${body}</div><div class="mf">${foot}</div>`,
            {cls: mode==="error" ? "err" : (mode==="warn" ? "warn" : "")});
}

/* 通用特种兵图标网格（选中态 .on；重复态 .blocked + 「已有」角标） */
function spickCellsHTML(items, onPick){
  return items.map(it=>`<div class="pcell ${it.blocked?'blocked':''} ${it.sel?'on':''}"
    title="${esc(it.title||it.name)}" onclick="${it.blocked?'void 0':onPick.replace("@ID", esc(JSON.stringify(it.id)))}">
    ${imgTag(it.tex, it.name)}${it.dup?`<span class="dup">${esc(it.dup)}</span>`:""}</div>`).join("");
}
/* 详情卡（复用 .slot 样式，但去掉「点击=卸下」的语义） */
function spickCardHTML(it){
  if(!it) return `<div class="slot empty" style="justify-content:center">还没选</div>`;
  const tags = (it.flags||[]).map(f=>`<span class="ftag">${esc(f)}</span>`).join("");
  return `<div class="slot spcard">
    <span class="sq">${imgTag(it.tex, it.name)}</span>
    <span class="slotinfo"><span class="slotname">${esc(it.name)}</span>
      <span class="slotflags">${tags||'<span class="none">无特性</span>'}</span></span>
    <span class="slotstats">
      <span class="st"><i>攻</i><b>${it.attack??"—"}</b></span>
      <span class="st"><i>防</i><b>${it.defense??"—"}</b></span>
      <span class="st"><i>装</i><b>${it.armor??"—"}</b></span>
      <span class="st"><i>炮</i><b>${it.artillery??"—"}</b></span>
    </span></div>`;
}
function natRowHTML(it){
  if(!it) return "";
  return `<div class="spnat" style="margin-top:8px">国籍 <b>${esc(it.nat||"—")}</b>
    <span class="auto">跟着特种兵自动 · 不用手选</span></div>`;
}
/* 模态框里的 Alt+滚轮数字 */
function bindModalSpin(id, get, set, min, max){
  const el = document.getElementById(id);
  if(!el) return;
  bindSpin(el, {base:get(), cur:get(), min:min, max:max, onChange(v){
    set(v);
    el.textContent = v;
    el.classList.toggle("dirty", v!==get());
  }});
}

/* ---------- 应用 / 撤销 ---------- */
/* 待应用的编辑列表 → 请求体（兵库**删条目**要排在最后：
   删了会让后面条目的下标整体前移，先删再改数量就会改错行，U35） */
function pendingEdits(){
  const edits = PENDING.map(p=>({kind:p.kind, params:p.params}));
  edits.sort((a,b)=>(a.kind==="hq_force_pool_remove"?1:0)
                    -(b.kind==="hq_force_pool_remove"?1:0));
  return edits;
}
async function doApply(){
  if(!PENDING.length) return;
  const box = document.getElementById("errBox");
  const wbox = document.getElementById("warnBox");
  box.textContent = ""; wbox.textContent = "";
  /* ⚠️ 先 plan（**不碰磁盘**）再弹确认框 —— 写盘前让玩家看清要改什么。
     plan.errors 非空 ⇒ 硬拦；只有 warnings ⇒ 软警告；都没有 ⇒ 正常确认。 */
  const r = await post("/api/plan", {save_id: VIEW._save_id, edits: pendingEdits()});
  const d = r.data;
  if(!d.ok){
    openConfirm("error", {errors:d.errors||[], changes:d.changes||[]});
    return;
  }
  if((d.warnings||[]).length){
    openConfirm("warn", {warnings:d.warnings||[], changes:d.changes||[],
      backup:d.backup, save_name:d.save_name});
    return;
  }
  openConfirm("ok", {changes:d.changes||[], backup:d.backup, save_name:d.save_name});
}
/* 确认框里点「应用更改」才真的写盘 */
async function reallyApply(){
  const r = await post("/api/commit", {save_id: VIEW._save_id, edits: pendingEdits()});
  const d = r.data;
  closeModal();
  if(d.ok){
    PENDING = [];
    paintPending();
    await openSave(VIEW._save_id);
    const w = document.getElementById("warnBox");
    if(w) w.textContent = (d.warnings||[]).join("\n");
  } else {
    const box = document.getElementById("errBox");
    if(box) box.textContent = (d.errors||[]).join("\n");
  }
}
async function doUndo(){
  const r = await post("/api/undo", {save_id: VIEW._save_id});
  const d = r.data;
  if(d.ok){ await openSave(VIEW._save_id); }
  else { const b=document.getElementById("errBox"); if(b) b.textContent=(d.errors||[]).join("\n"); }
}

/* ---------------- 启动页 ---------------- */
async function reload(){
  const d = await api("/api/saves");
  SAVES = d.saves || [];
  paint();
}
function paint(){
  const q = (document.getElementById("q").value||"").trim().toLowerCase();
  const list = SAVES.filter(s => !q ||
    (s.name+" "+s.display+" "+s.campaign).toLowerCase().includes(q));
  document.getElementById("cnt").textContent = list.length + " 个存档";
  document.getElementById("empty").style.display = list.length ? "none":"block";
  document.getElementById("rows").innerHTML = list.map(s => `
    <tr onclick="openSave('${encodeURIComponent(s.save_id).replace(/'/g, "%27")}')">
      <td>${esc(s.name)}<div style="color:var(--muted);font-size:11.5px">${esc(s.display)}</div></td>
      <td class="k">${esc(s.kind)}</td>
      <td class="k">${esc(s.scenario||"—")}</td>
      <td class="num">${esc(s.mtime)}</td>
      <td class="num">${esc(s.size)}</td>
    </tr>`).join("");
}
document.getElementById("q").addEventListener("input", paint);

function esc(s){ return String(s??"").replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

async function openSave(sid){
  try {
    VIEW = await api("/api/view/" + encOnce(sid));
  } catch(e) {
    const r = document.getElementById("rows");
    if(r) r.innerHTML = `<tr><td colspan="5" style="color:var(--danger)">`
      + `读取存档失败：${esc(e.message)}</td></tr>`;
    throw e;
  }
  document.getElementById("splash").style.display = "none";
  document.getElementById("app").style.display = "flex";
  /* 目录是异步的 ⇒ 到位后**重绘一次**，否则中文名与卡牌贴图一开始全是 id / 404 */
  loadCatalog().then(()=>{ if(VIEW) show(PAGE); }).catch(()=>{});
  /* 选择器候选（战役池 / 商店可上架范围 / 卡牌白名单）**每个存档加载一次** ——
     商店页与卡牌页都要用（之前只有单位页按需加载 ⇒ 模态框里 0 种）。 */
  PICKCACHE = {};
  loadPickers("").then(()=>{ if(VIEW) show(PAGE); }).catch(()=>{});
  document.getElementById("hTitle").textContent = VIEW.save.display || VIEW.save.name;
  document.getElementById("hCaps").innerHTML = (VIEW._features||[]).map(f =>
    `<span class="pill ${f.ok?'on':'off'}" title="${esc(f.reason)}">${FEATURE_CN[f.name]||f.name} ${f.ok?'✓':'✗'}</span>`
  ).join("");
  document.getElementById("status").innerHTML =
    `能力位：${(VIEW._features||[]).filter(f=>f.ok).length}/${(VIEW._features||[]).length} 可用` +
    ` · 声望 <b class="ok">${VIEW.prestige??"—"}</b> · 分数 <b>${VIEW.score??"—"}</b>` +
    ` · 单位 <b>${(VIEW.units||[]).length}</b> · 总部 <b>${(VIEW.hqs||[]).length}</b>`;
  show(PAGE);
}

document.querySelectorAll(".rail .nav").forEach(n =>
  n.addEventListener("click", ()=>{ PAGE=n.dataset.p;
    document.querySelectorAll(".rail .nav").forEach(x=>x.classList.toggle("on", x===n));
    show(PAGE); }));

function show(p){
  const w = document.getElementById("work");
  if(p==="overview"){
    const caps = (VIEW._features||[]).map(f=>`
      <div class="capcard ${f.ok?'ok':'off'}">
        <div class="h">${FEATURE_CN[f.name]||f.name} ${f.ok?'✓':'✗'}</div>
        ${f.ok?"":`<div class="r">${esc(f.reason)}</div>`}
      </div>`).join("");
    w.innerHTML = `<div class="panel"><h3>概览 · 能力位体检</h3>
      <div class="pbody"><div class="capgrid">${caps}</div></div></div>
      <div class="panel"><h3>战役进度（可直接输入 · Alt+滚轮 ±1）</h3>
      <div class="pbody">
        <div class="tun"><span class="k">声望</span>
          <input class="num" id="n_prestige" data-f="prestige" type="text"
                 inputmode="numeric" autocomplete="off">
          <span class="old" id="o_prestige"></span>
          <span class="hint">可直接输入 · Alt+滚轮 ±1</span></div>
        <div class="tun"><span class="k">分数</span>
          <input class="num" id="n_score" data-f="score" type="text"
                 inputmode="numeric" autocomplete="off">
          <span class="old" id="o_score"></span>
          <span class="hint">可直接输入 · Alt+滚轮 ±1</span></div>
        <div class="note" style="margin-top:10px">
          <b>这一版能做什么</b>：读存档、列能力位、<b>改战役进度</b>（改完进「待应用」，
          点右上角「应用更改」才写盘，写前自动备份、可撤销）。<br>
          <b>各页进度</b>：单位 ✅ · 总部 ✅ · 卡牌 ✅ · 商店 ✅ · 战区资产 ✅ · 战役 ✅（只读）。
          <b>战区资产</b>要存档正在战斗里才有内容（它是唯一的 L3 写入例外）。
        </div>
      </div></div>
      `;
    bindTun();
    paintPending();
    return;
  }
  if(p==="units"){ pageUnits(w); return; }
  if(p==="hqs"){ pageHqs(w); return; }
  if(p==="cards"){ pageCards(w); return; }
  if(p==="store"){ pageStore(w); return; }
  if(p==="theater"){ pageTheater(w); return; }
  if(p==="campaign"){ pageCampaign(w); return; }
  w.innerHTML = `<div class="panel"><h3>${PAGE_CN[p]||p}</h3>
    <div class="placeholder"><div class="big">这一页还没做</div>
    等 GUI 微调需求提完，按最终视觉稿一次性实现（避免返工）。</div></div>`;
}

reload().catch(e => {
  document.getElementById("rows").innerHTML =
    `<tr><td colspan="5" style="color:var(--danger)">加载失败：${esc(e.message)}</td></tr>`;
}).then(() => {
  /* 深链接：?open=<save_id> 直接进主界面 */
  if(OPEN_ID) return openSave(OPEN_ID).catch(e => {
    const r = document.getElementById("rows");
    if(r) r.innerHTML = `<tr><td colspan="5" style="color:var(--danger)">`
      + `打开存档失败：${esc(e.message)}</td></tr>`;
  });
});
</script>
